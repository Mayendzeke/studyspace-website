name: Deploy Study Space public website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: public-website-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate public website content
        run: node --test scripts/site-quality.test.mjs
      - name: Assemble the static website
        run: |
          rm -rf dist
          mkdir -p dist
          cp index.html 404.html privacy.html terms.html legal.css styles.css script.js favicon-192.png favicon.svg google44c56855cf57a2ae.html robots.txt sitemap.xml .nojekyll dist/
          cp -R assets dist/assets
          test -s dist/index.html
          test -s dist/terms.html
          test -s dist/privacy.html
          test -s dist/assets/app-qr.svg
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v5
